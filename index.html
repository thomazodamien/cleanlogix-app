<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanLogix Realtime - Gestion & Réapprovisionnement</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- SDKs Firebase (Version Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col antialiased selection:bg-teal-500 selection:text-white pb-16 md:pb-0">

    <!-- INITIALISATION FIREBASE -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD2Efo5GxOd2UhOWapBtjJTOmS2gnaKkW4",
            authDomain: "cleanlogixapp.firebaseapp.com",
            projectId: "cleanlogixapp",
            storageBucket: "cleanlogixapp.firebasestorage.app",
            messagingSenderId: "244706789950",
            appId: "1:244706789950:web:ebac4e7b5f9cef70b49f6f",
            measurementId: "G-118254J5X4"
        };

        let db = null;
        let isCloudConnected = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isCloudConnected = true;
            console.log("Connecté à la base de données Firebase CleanLogix !");
        } catch (e) {
            console.error("Erreur d'initialisation Firebase :", e);
        }
    </script>

    <!-- HEADER / NAVIGATION -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Indicateur Cloud -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-slate-900 font-bold text-xl shadow-lg shadow-teal-500/20">
                        <i class="ph-bold ph-sparkle text-2xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg leading-tight tracking-tight">Clean<span class="text-teal-400">Logix</span></h1>
                        <p class="text-[11px] text-slate-400 flex items-center gap-1">
                            <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span id="sync-status">Cloud Direct Connecté</span>
                        </p>
                    </div>
                </div>

                <!-- Changement de Rôle -->
                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-xl border border-slate-700/60">
                    <button id="btn-role-agent" onclick="switchRole('agent')" class="flex items-center gap-2 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-teal-500 text-slate-950 shadow-md transition-all cursor-pointer">
                        <i class="ph text-base ph-broom"></i>
                        <span>Vue Agent</span>
                    </button>
                    <button id="btn-role-manager" onclick="switchRole('manager')" class="relative flex items-center gap-2 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white transition-all cursor-pointer">
                        <i class="ph text-base ph-clipboard-text"></i>
                        <span>Responsable</span>
                        <span id="nav-unread-badge" class="hidden absolute -top-1.5 -right-1.5 flex h-5 w-5 items-center justify-center rounded-full bg-rose-500 text-[10px] font-extrabold text-white shadow-md animate-bounce">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- NOTIFICATION PUSH IN-APP -->
    <div id="push-notification" class="fixed top-20 right-4 left-4 sm:left-auto sm:w-96 z-50 transform translate-y-[-180%] transition-transform duration-500 ease-out pointer-events-none">
        <div class="bg-slate-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl border border-teal-500/40 flex gap-3.5 items-start pointer-events-auto">
            <div class="p-2.5 bg-teal-500/20 text-teal-400 rounded-xl flex-shrink-0">
                <i class="ph-fill ph-bell-ringing text-2xl animate-pulse"></i>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                    <span class="text-[10px] font-bold text-teal-400 uppercase tracking-wider">Nouvelle Commande !</span>
                    <span class="text-[10px] text-slate-400">En direct</span>
                </div>
                <h4 id="push-title" class="text-sm font-bold text-white mt-0.5 truncate">Commande reçue</h4>
                <p id="push-body" class="text-xs text-slate-300 mt-1 line-clamp-2">Chargement du détail...</p>
                <div class="mt-3 flex items-center gap-2">
                    <button onclick="switchRole('manager'); dismissPushNotification();" class="text-xs bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                        Ouvrir et préparer
                    </button>
                </div>
            </div>
            <button onclick="dismissPushNotification()" class="text-slate-400 hover:text-white cursor-pointer">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
    </div>

    <!-- MAIN WRAPPER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- VUE 1 : AGENT -->
        <div id="view-agent" class="space-y-6">
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i class="ph-duotone ph-hand-waving text-teal-600 text-2xl"></i>
                        Espace Agent de Propreté
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Faites votre demande de réapprovisionnement.</p>
                </div>

                <div class="flex flex-wrap sm:flex-nowrap items-center gap-3">
                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Agent Intervenant</label>
                        <select id="agent-name-select" onchange="onAgentSelectChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-semibold">
                            <!-- Dynamique -->
                        </select>
                    </div>

                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Zone d'intervention</label>
                        <input type="text" id="agent-location-input" placeholder="Ex: Bâtiment A - Étage 2" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- CATALOGUE -->
                <div class="lg:col-span-2 space-y-5">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                            <input type="text" id="catalog-search" oninput="renderCatalog()" placeholder="Rechercher un produit..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
                        </div>
                    </div>
                    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Produits dynamiques -->
                    </div>
                </div>

                <!-- PANIER -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sticky top-24 flex flex-col max-h-[calc(100vh-7rem)]">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                            <h3 class="font-bold text-slate-900 flex items-center gap-2">
                                <i class="ph-bold ph-shopping-cart text-teal-600 text-lg"></i>
                                Panier de Réappro
                            </h3>
                            <span id="cart-count-badge" class="bg-teal-50 text-teal-700 text-xs font-bold px-2.5 py-0.5 rounded-full border border-teal-200">0 article</span>
                        </div>

                        <div id="cart-items" class="flex-1 overflow-y-auto py-4 space-y-3 min-h-[140px]">
                            <!-- Contenu Panier -->
                        </div>

                        <div class="pt-4 border-t border-slate-100 space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1.5">Urgence :</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <label class="flex items-center justify-center p-2 rounded-xl border text-xs font-semibold cursor-pointer has-[:checked]:border-teal-500 has-[:checked]:bg-teal-50">
                                        <input type="radio" name="priority" value="Normal" checked class="sr-only">
                                        <span>Normal</span>
                                    </label>
                                    <label class="flex items-center justify-center p-2 rounded-xl border text-xs font-semibold cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                        <input type="radio" name="priority" value="Urgent" class="sr-only">
                                        <span>Urgent</span>
                                    </label>
                                    <label class="flex items-center justify-center p-2 rounded-xl border text-xs font-semibold cursor-pointer has-[:checked]:border-rose-500 has-[:checked]:bg-rose-50">
                                        <input type="radio" name="priority" value="Très Urgent" class="sr-only">
                                        <span class="text-rose-600">🚨 Critique</span>
                                    </label>
                                </div>
                            </div>

                            <!-- CHAMP COMMENTAIRE -->
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Commentaire / Remarque :</label>
                                <textarea id="order-comment-input" rows="2" placeholder="Précisez un détail (ex: clé manquante, pièce spécifique...)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none focus:border-teal-500 resize-none"></textarea>
                            </div>

                            <button id="btn-submit-order" onclick="submitOrder()" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2">
                                <i class="ph-bold ph-paper-plane-right text-lg"></i>
                                <span>Envoyer au Responsable</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VUE 2 : RESPONSABLE -->
        <div id="view-manager" class="hidden space-y-6">
            <!-- Écran PIN -->
            <div id="manager-lock-screen" class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-xl border border-slate-200 text-center">
                <div class="w-16 h-16 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="ph-bold ph-lock-key"></i>
                </div>
                <h2 class="text-xl font-extrabold text-slate-900">Espace Responsable</h2>
