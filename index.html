<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InguiClean - Gestion & Réapprovisionnement</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col antialiased selection:bg-teal-500 selection:text-white pb-16 md:pb-0">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-teal-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
                        <i class="ph-bold ph-plant text-2xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg leading-tight tracking-tight">Ingui<span class="text-teal-400">Clean</span></h1>
                        <p class="text-[11px] text-slate-400">Mode Opérationnel</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-xl border border-slate-700">
                    <button id="btn-role-agent" onclick="switchRole('agent')" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-teal-500 text-slate-950 shadow-md">
                        Vue Agent
                    </button>
                    <button id="btn-role-manager" onclick="switchRole('manager')" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white">
                        Responsable
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- VUE 1 : AGENT -->
        <div id="view-agent" class="space-y-6">
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Espace Agent de Propreté</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Faites votre demande de réapprovisionnement.</p>
                </div>

                <div class="flex flex-wrap sm:flex-nowrap items-center gap-3">
                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Agent Intervenant</label>
                        <select id="agent-name-select" onchange="onAgentSelectChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-semibold">
                        </select>
                    </div>

                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Zone d'intervention</label>
                        <input type="text" id="agent-location-input" placeholder="Ex: Bâtiment A - Étage 2" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- CATALOGUE -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="flex items-center gap-2 overflow-x-auto pb-1 hide-scrollbar" id="category-tabs">
                        <button onclick="setCategoryFilter('Tous')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-teal-500 text-slate-950">Tous</button>
                        <button onclick="setCategoryFilter('Produits')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">Produits</button>
                        <button onclick="setCategoryFilter('Poubelle')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">Poubelle</button>
                        <button onclick="setCategoryFilter('EPI')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">EPI</button>
                        <button onclick="setCategoryFilter('Matériel')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">Matériel</button>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                        <input type="text" id="catalog-search" oninput="renderCatalog()" placeholder="Rechercher un produit..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
                    </div>

                    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                </div>

                <!-- PANIER -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sticky top-24 flex flex-col space-y-4">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                            <h3 class="font-bold text-slate-900">Panier de Réappro</h3>
                            <span id="cart-count-badge" class="bg-teal-50 text-teal-700 text-xs font-bold px-2.5 py-0.5 rounded-full border border-teal-200">0 article</span>
                        </div>

                        <div id="cart-items" class="flex-1 overflow-y-auto py-2 space-y-2 min-h-[120px]"></div>

                        <div class="pt-4 border-t border-slate-100 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Urgence :</label>
                                <select id="order-priority-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-semibold">
                                    <option value="Normal">Normal</option>
                                    <option value="Urgent">Urgent</option>
                                    <option value="Très Urgent">🚨 Critique</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Remarque :</label>
                                <textarea id="order-comment-input" rows="2" placeholder="Précisez un détail..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs outline-none resize-none"></textarea>
                            </div>

                            <button id="btn-submit-order" onclick="submitOrder()" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-3 px-4 rounded-xl">
                                Envoyer au Responsable
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VUE 2 : RESPONSABLE -->
        <div id="view-manager" class="hidden space-y-6">
            <!-- Écran PIN -->
            <div id="manager-lock-screen" class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-xl border border-slate-200 text-center">
                <div class="w-16 h-16 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                    🔑
                </div>
                <h2 class="text-xl font-extrabold text-slate-900">Espace Responsable</h2>
                <div class="my-6">
                    <input type="password" id="manager-pin-input" maxlength="4" placeholder="••••" class="w-40 text-center text-2xl font-bold py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none tracking-widest">
                </div>
                <button onclick="verifyManagerPin()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl">Déverrouiller</button>
                <p id="pin-error-msg" class="text-rose-500 text-xs font-semibold mt-3 hidden">Code PIN incorrect.</p>
            </div>

            <!-- Contenu Déverrouillé -->
            <div id="manager-unlocked-content" class="hidden space-y-6">
                <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div>
                        <h2 class="text-2xl font-black">Administration</h2>
                        <p class="text-slate-400 text-xs mt-1">Canal Ntfy : <strong>inguiclean-responsable-2256</strong></p>
                    </div>
                    <button onclick="clearAllOrders()" class="text-xs bg-rose-600 text-white font-bold px-4 py-2 rounded-xl">Vider l'historique</button>
                </div>

                <!-- COMMANDES -->
                <div class="space-y-4">
                    <h3 class="font-extrabold text-slate-900 text-xl">Commandes Reçues</h3>
                    <div id="orders-list-container" class="space-y-4"></div>
                </div>

                <!-- GESTION -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-slate-200">
                    <!-- AGENTS -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
                        <h3 class="font-bold text-slate-900">Ajouter un Agent</h3>
                        <div class="space-y-2">
                            <input type="text" id="new-agent-name" placeholder="Nom de l'agent" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <input type="text" id="new-agent-sector" placeholder="Zone (ex: Bâtiment A)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <button onclick="addNewAgent()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-xs">Ajouter Agent</button>
                        </div>
                        <div id="manager-agents-list" class="space-y-2 max-h-40 overflow-y-auto pt-2 border-t border-slate-100"></div>
                    </div>

                    <!-- PRODUITS -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
                        <h3 class="font-bold text-slate-900">Ajouter un Produit</h3>
                        <div class="space-y-2">
                            <input type="text" id="new-prod-name" placeholder="Nom du produit" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <input type="text" id="new-prod-unit" placeholder="Unité (ex: Bidon 5L)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <select id="new-prod-cat" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                                <option value="Produits">Produits</option>
                                <option value="Poubelle">Poubelle</option>
                                <option value="EPI">EPI</option>
                                <option value="Matériel">Matériel</option>
                            </select>
                            <button onclick="addNewProduct()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-xs">Ajouter Produit</button>
                        </div>
                        <div id="manager-products-list" class="space-y-2 max-h-40 overflow-y-auto pt-2 border-t border-slate-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT SIMPLIFIÉ ULTRA-FIABLE -->
    <script>
        var DEFAULT_PRODUCTS = [
            { id: "p1", name: "Détergent sols concentré 5L", unit: "Bidon 5L", category: "Produits" },
            { id: "p2", name: "Désinfectant multi-surfaces 750ml", unit: "Flacon", category: "Produits" },
            { id: "p3", name: "Sacs poubelle 100L renforcés", unit: "Rouleau de 25", category: "Poubelle" },
            { id: "p4", name: "Gants nitrile jetables", unit: "Boîte de 100", category: "EPI" },
            { id: "p5", name: "Chiffons microfibres pro", unit: "Lot de 10", category: "Matériel" }
        ];

        var DEFAULT_AGENTS = [
            { id: "a1", name: "Sophie Martin", sector: "Bâtiment A - Étage 1" },
            { id: "a2", name: "Marc Leroy", sector: "Bâtiment B - RDC" }
        ];

        var catalog = [];
        var agents = [];
        var orders = [];
        var cart = {};
        var currentCategory = "Tous";

        window.onload = function() {
            try {
                catalog = JSON.parse(localStorage.getItem('inguiclean_catalog')) || DEFAULT_PRODUCTS;
                agents = JSON.parse(localStorage.getItem('inguiclean_agents')) || DEFAULT_AGENTS;
                orders = JSON.parse(localStorage.getItem('inguiclean_orders')) || [];
            } catch(e) {
                catalog = DEFAULT_PRODUCTS;
                agents = DEFAULT_AGENTS;
                orders = [];
            }

            initAgentsSelect();
            renderCatalog();
            renderCart();
            renderManagerManagementLists();
            renderOrdersList();
        };

        function switchRole(role) {
            var viewAgent = document.getElementById('view-agent');
            var viewManager = document.getElementById('view-manager');
            var btnAgent = document.getElementById('btn-role-agent');
            var btnManager = document.getElementById('btn-role-manager');

            if (role === 'agent') {
                viewAgent.classList.remove('hidden');
                viewManager.classList.add('hidden');
                btnAgent.className = "px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-teal-500 text-slate-950 shadow-md";
                btnManager.className = "px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white";
            } else {
                viewManager.classList.remove('hidden');
                viewAgent.classList.add('hidden');
                btnManager.className = "px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-teal-500 text-slate-950 shadow-md";
                btnAgent.className = "px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white";
            }
        }

        function verifyManagerPin() {
            var input = document.getElementById('manager-pin-input');
            var error = document.getElementById('pin-error-msg');
            var lock = document.getElementById('manager-lock-screen');
            var content = document.getElementById('manager-unlocked-content');

            if (input && input.value === "2256") {
                lock.classList.add('hidden');
                content.classList.remove('hidden');
                error.classList.add('hidden');
                renderManagerManagementLists();
            } else {
                error.classList.remove('hidden');
                if (input) input.value = "";
            }
        }

        function initAgentsSelect() {
            var select = document.getElementById('agent-name-select');
            if (!select) return;
            select.innerHTML = "";
            agents.forEach(function(a) {
                select.innerHTML += '<option value="' + a.name + '" data-sector="' + a.sector + '">' + a.name + '</option>';
            });
            onAgentSelectChange();
        }

        function onAgentSelectChange() {
            var select = document.getElementById('agent-name-select');
            var input = document.getElementById('agent-location-input');
            if (!select || !input) return;
            var opt = select.options[select.selectedIndex];
            if (opt) input.value = opt.getAttribute('data-sector') || '';
        }

        function setCategoryFilter(cat) {
            currentCategory = cat;
            renderCatalog();
        }

        function renderCatalog() {
            var grid = document.getElementById('products-grid');
            var search = document.getElementById('catalog-search');
            if (!grid) return;
            grid.innerHTML = "";
            var val = search ? search.value.toLowerCase() : "";

            var filtered = catalog.filter(function(p) {
                var mCat = (currentCategory === "Tous" || p.category === currentCategory);
                var mSearch = p.name.toLowerCase().indexOf(val) !== -1;
                return mCat && mSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-xs text-slate-400 col-span-2 text-center py-6">Aucun produit</p>';
                return;
            }

            filtered.forEach(function(p) {
                var qty = cart[p.id] || 0;
                grid.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between gap-3">
                        <div>
                            <span class="text-[10px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-md">${p.category}</span>
                            <h4 class="font-bold text-slate-900 text-sm mt-1">${p.name}</h4>
                            <p class="text-xs text-slate-400">${p.unit}</p>
                        </div>
                        <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                            <button onclick="updateCart('${p.id}', -1)" class="w-8 h-8 rounded-xl bg-slate-100 font-bold">-</button>
                            <span class="w-6 text-center font-bold text-sm">${qty}</span>
                            <button onclick="updateCart('${p.id}', 1)" class="w-8 h-8 rounded-xl bg-teal-500 font-bold text-slate-950">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateCart(id, delta) {
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] <= 0) delete cart[id];
            renderCatalog();
            renderCart();
        }

        function renderCart() {
            var container = document.getElementById('cart-items');
            var btn = document.getElementById('btn-submit-order');
            var badge = document.getElementById('cart-count-badge');
            var keys = Object.keys(cart);
            if (!container) return;
            container.innerHTML = "";

            var count = 0;
            keys.forEach(function(k) { count += cart[k]; });
            if (badge) badge.textContent = count + " article" + (count > 1 ? 's' : '');

            if (keys.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Panier vide</p>';
                if (btn) {
                    btn.disabled = true;
                    btn.className = "w-full bg-slate-200 text-slate-400 font-bold py-3 px-4 rounded-xl";
                }
                return;
            }

            keys.forEach(function(k) {
                var p = catalog.find(function(i) { return i.id === k; });
                if (p) {
                    container.innerHTML += `
                        <div class="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg">
                            <span class="font-bold text-slate-800">${p.name}</span>
                            <span class="font-bold text-teal-600">x${cart[k]}</span>
                        </div>
                    `;
                }
            });

            if (btn) {
                btn.disabled = false;
                btn.className = "w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg cursor-pointer";
            }
        }

        function submitOrder() {
            var agent = document.getElementById('agent-name-select').value;
            var loc = document.getElementById('agent-location-input').value;
            var prio = document.getElementById('order-priority-select').value;
            var comm = document.getElementById('order-comment-input').value;

            var items = Object.keys(cart).map(function(k) {
                var p = catalog.find(function(i) { return i.id === k; });
                return { name: p ? p.name : k, quantity: cart[k], unit: p ? p.unit : '' };
            });

            var newOrder = {
                id: "ord_" + Date.now(),
                agent: agent,
                location: loc,
                priority: prio,
                comment: comm,
                items: items,
                status: "En attente"
            };

            orders.unshift(newOrder);
            localStorage.setItem('inguiclean_orders', JSON.stringify(orders));

            // Envoi Ntfy garanti
            var msg = "Agent: " + agent + "\nZone: " + loc + "\nPriorite: " + prio + "\nProduits:\n" + items.map(i => "- " + i.name + " (x" + i.quantity + ")").join("\n");
            var img = new Image();
            img.src = "https://ntfy.sh/inguiclean-responsable-2256/publish?message=" + encodeURIComponent(msg);

            cart = {};
            document.getElementById('order-comment-input').value = "";
            renderCatalog();
            renderCart();
            renderOrdersList();
            alert("Demande envoyée !");
        }

        function renderManagerManagementLists() {
            var agCont = document.getElementById('manager-agents-list');
            var prCont = document.getElementById('manager-products-list');

            if (agCont) {
                agCont.innerHTML = "";
                agents.forEach(function(a) {
                    agCont.innerHTML += `
                        <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-xl">
                            <span><strong>${a.name}</strong> (${a.sector})</span>
                            <button onclick="deleteAgent('${a.id}')" class="text-rose-500 font-bold">✕</button>
                        </div>
                    `;
                });
            }

            if (prCont) {
                prCont.innerHTML = "";
                catalog.forEach(function(p) {
                    prCont.innerHTML += `
                        <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-xl">
                            <span><strong>${p.name}</strong> (${p.unit})</span>
                            <button onclick="deleteProduct('${p.id}')" class="text-rose-500 font-bold">✕</button>
                        </div>
                    `;
                });
            }
        }

        function addNewAgent() {
            var name = document.getElementById('new-agent-name').value;
            var sec = document.getElementById('new-agent-sector').value;
            if (!name) return alert("Entrez un nom");

            agents.push({ id: "a_" + Date.now(), name: name, sector: sec || "Général" });
            localStorage.setItem('inguiclean_agents', JSON.stringify(agents));
            initAgentsSelect();
            renderManagerManagementLists();
            document.getElementById('new-agent-name').value = "";
            document.getElementById('new-agent-sector').value = "";
        }

        function deleteAgent(id) {
            agents = agents.filter(function(a) { return a.id !== id; });
            localStorage.setItem('inguiclean_agents', JSON.stringify(agents));
            initAgentsSelect();
            renderManagerManagementLists();
        }

        function addNewProduct() {
            var name = document.getElementById('new-prod-name').value;
            var unit = document.getElementById('new-prod-unit').value;
            var cat = document.getElementById('new-prod-cat').value;
            if (!name) return alert("Entrez un produit");

            catalog.push({ id: "p_" + Date.now(), name: name, unit: unit || "Unité", category: cat });
            localStorage.setItem('inguiclean_catalog', JSON.stringify(catalog));
            renderCatalog();
            renderManagerManagementLists();
            document.getElementById('new-prod-name').value = "";
            document.getElementById('new-prod-unit').value = "";
        }

        function deleteProduct(id) {
            catalog = catalog.filter(function(p) { return p.id !== id; });
            localStorage.setItem('inguiclean_catalog', JSON.stringify(catalog));
            renderCatalog();
            renderManagerManagementLists();
        }

        function clearAllOrders() {
            if (!confirm("Tout effacer ?")) return;
            orders = [];
            localStorage.setItem('inguiclean_orders', JSON.stringify(orders));
            renderOrdersList();
        }

        function renderOrdersList() {
            var cont = document.getElementById('orders-list-container');
            if (!cont) return;
            cont.innerHTML = "";

            if (orders.length === 0) {
                cont.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-slate-400">Aucune commande.</div>';
                return;
            }

            orders.forEach(function(o) {
                var list = o.items ? o.items.map(i => "<li>• " + i.name + " <strong>x" + i.quantity + "</strong></li>").join('') : '';
                cont.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-slate-900">${o.agent}</h4>
                                <p class="text-xs text-slate-400">${o.location}</p>
                            </div>
                            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100">${o.priority}</span>
                        </div>
                        <ul class="text-xs bg-slate-50 p-2 rounded-xl space-y-1">${list}</ul>
                        ${o.comment ? `<p class="text-xs text-amber-800 bg-amber-50 p-2 rounded-xl"><strong>Note:</strong> ${o.comment}</p>` : ''}
                        <div class="flex justify-between items-center pt-2">
                            <span class="text-xs font-bold text-amber-600">${o.status}</span>
                            <button onclick="updateStatus('${o.id}', 'Prête')" class="text-xs bg-emerald-600 text-white font-bold px-3 py-1 rounded-xl">Marquer Prête</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateStatus(id, stat) {
            var ord = orders.find(function(o) { return o.id === id; });
            if (ord) {
                ord.status = stat;
                localStorage.setItem('inguiclean_orders', JSON.stringify(orders));
                renderOrdersList();
            }
        }
    </script>
</body>
</html>
