<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InguiClean - Gestion & Réapprovisionnement</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col antialiased selection:bg-teal-500 selection:text-white pb-16 md:pb-0">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-teal-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
                        <i class="ph-bold ph-plant text-2xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg leading-tight tracking-tight">Ingui<span class="text-teal-400">Clean</span></h1>
                        <p class="text-[11px] text-slate-400">Mode Opérationnel</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-xl border border-slate-700">
                    <button id="btn-role-agent" onclick="switchRole('agent')" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-teal-500 text-slate-950 shadow-md">
                        Vue Agent
                    </button>
                    <button id="btn-role-manager" onclick="switchRole('manager')" class="px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white">
                        Responsable
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- VUE 1 : AGENT -->
        <div id="view-agent" class="space-y-6">
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Espace Agent de Propreté</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Faites votre demande de réapprovisionnement.</p>
                </div>

                <div class="flex flex-wrap sm:flex-nowrap items-center gap-3">
                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Agent Intervenant</label>
                        <select id="agent-name-select" onchange="onAgentSelectChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-semibold">
                        </select>
                    </div>

                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Zone d'intervention</label>
                        <input type="text" id="agent-location-input" placeholder="Ex: Bâtiment A - Étage 2" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- CATALOGUE -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="flex items-center gap-2 overflow-x-auto pb-1 hide-scrollbar" id="category-tabs">
                        <button onclick="setCategoryFilter('Tous')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-teal-500 text-slate-950">Tous</button>
                        <button onclick="setCategoryFilter('Produits')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">Produits</button>
                        <button onclick="setCategoryFilter('Poubelle')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">Poubelle</button>
                        <button onclick="setCategoryFilter('EPI')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">EPI</button>
                        <button onclick="setCategoryFilter('Matériel')" class="cat-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200">Matériel</button>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                        <input type="text" id="catalog-search" oninput="renderCatalog()" placeholder="Rechercher un produit..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
                    </div>

                    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                </div>

                <!-- PANIER -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sticky top-24 flex flex-col space-y-4">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                            <h3 class="font-bold text-slate-900">Panier de Réappro</h3>
                            <span id="cart-count-badge" class="bg-teal-50 text-teal-700 text-xs font-bold px-2.5 py-0.5 rounded-full border border-teal-200">0 article</span>
                        </div>

                        <div id="cart-items" class="flex-1 overflow-y-auto py-2 space-y-2 min-h-[120px]"></div>

                        <div class="pt-4 border-t border-slate-100 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Urgence :</label>
                                <select id="order-priority-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-semibold">
                                    <option value="Normal">Normal</option>
                                    <option value="Urgent">Urgent</option>
                                    <option value="Très Urgent">🚨 Critique</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Remarque :</label>
                                <textarea id="order-comment-input" rows="2" placeholder="Précisez un détail..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs outline-none resize-none"></textarea>
                            </div>

                            <button id="btn-submit-order" onclick="submitOrder()" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-3 px-4 rounded-xl">
                                Envoyer au Responsable
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VUE 2 : RESPONSABLE -->
        <div id="view-manager" class="hidden space-y-6">
            <!-- Écran PIN -->
            <div id="manager-lock-screen" class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-xl border border-slate-200 text-center">
                <div class="w-16 h-16 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                    🔑
                </div>
                <h2 class="text-xl font-extrabold text-slate-900">Espace Responsable</h2>
                <div class="my-6">
                    <input type="password" id="manager-pin-input" maxlength="4" placeholder="••••" class="w-40 text-center text-2xl font-bold py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none tracking-widest">
                </div>
                <button onclick="verifyManagerPin()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl">Déverrouiller</button>
                <p id="pin-error-msg" class="text-rose-500 text-xs font-semibold mt-3 hidden">Code PIN incorrect.</p>
            </div>

            <!-- Contenu Déverrouillé -->
            <div id="manager-unlocked-content" class="hidden space-y-6">
                <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div>
                        <h2 class="text-2xl font-black">Administration</h2>
                        <p class="text-slate-400 text-xs mt-1">Canal Ntfy : <strong>inguiclean-responsable-2256</strong></p>
                    </div>
                    <button onclick="clearAllOrders()" class="text-xs bg-rose-600 text-white font-bold px-4 py-2 rounded-xl">Vider l'historique</button>
                </div>

                <!-- COMMANDES -->
                <div class="space-y-4">
                    <h3 class="font-extrabold text-slate-900 text-xl">Commandes Reçues</h3>
                    <div id="orders-list-container" class="space-y-4"></div>
                </div>

                <!-- GESTION -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-slate-200">
                    <!-- AGENTS -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
                        <h3 class="font-bold text-slate-900">Ajouter un Agent</h3>
                        <div class="space-y-2">
                            <input type="text" id="new-agent-name" placeholder="Nom de l'agent" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <input type="text" id="new-agent-sector" placeholder="Zone (ex: Bâtiment A)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <button onclick="addNewAgent()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-xs">Ajouter Agent</button>
                        </div>
                        <div id="manager-agents-list" class="space-y-2 max-h-40 overflow-y-auto pt-2 border-t border-slate-100"></div>
                    </div>

                    <!-- PRODUITS -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
                        <h3 class="font-bold text-slate-900">Ajouter un Produit</h3>
                        <div class="space-y-2">
                            <input type="text" id="new-prod-name" placeholder="Nom du produit" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <input type="text" id="new-prod-unit" placeholder="Unité (ex: Bidon 5L)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                            <select id="new-prod-cat" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                                <option value="Produits">Produits</option>
                                <option value="Poubelle">Poubelle</option>
                                <option value="EPI">EPI</option>
                                <option value="Matériel">Matériel</option>
                            </select>
                            <button onclick="addNewProduct()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-xs">Ajouter Produit</button>
                        </div>
                        <div id="manager-products-list" class="space-y-2 max-h-40 overflow-y-auto pt-2 border-t border-slate-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT SIMPLIFIÉ ULTRA-FIABLE -->
    <script>
        var DEFAULT_PRODUCTS = [
            { id: "p1", name: "Détergent sols concentré 5L", unit: "Bidon 5L", category: "Produits" },
            { id: "p2", name: "Désinfectant multi-surfaces 750ml", unit: "Flacon", category: "Produits" },
            { id: "p3", name: "Sacs poubelle 100L renforcés", unit: "Rouleau de 25", category: "Poubelle" },
            { id: "p4", name: "Gants nitrile jetables", unit: "Boîte de 100", category: "EPI" },
            { id: "p5", name: "Chiffons microfibres pro", unit: "Lot de 10", category: "Matériel" }
        ];

        var
